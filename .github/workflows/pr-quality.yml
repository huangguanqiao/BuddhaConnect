name: PR quality checks

on:
  pull_request:
    branches: [master]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: pr-quality-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  quality:
    name: Astro check and production build
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout requested commit
        uses: actions/checkout@v4
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - name: Install pinned dependencies
        run: npm ci --no-audit --no-fund
      - name: Validate Astro and TypeScript
        run: npm run check
      - name: Build static site
        run: npm run build
      - name: Verify distribution
        shell: bash
        run: |
          set -euo pipefail
          test -s dist/index.html
          test -d dist/_astro
          echo "Built HTML and Astro assets verified."
