name: Publish current UAT build to Production

on:
  workflow_dispatch:

permissions:
  contents: write
  actions: read

concurrency:
  group: buddhaconnect-production-release
  cancel-in-progress: false

jobs:
  publish:
    if: github.ref == 'refs/heads/master'
    runs-on: ubuntu-latest
    environment: production
    steps:
      - name: Find latest fully successful UAT deployment
        id: uat
        uses: actions/github-script@v7
        with:
          script: |
            const owner = context.repo.owner;
            const repo = context.repo.repo;
            const { data } = await github.rest.actions.listWorkflowRuns({
              owner, repo, workflow_id: 'deploy.yml',
              branch: 'master', per_page: 1
            });
            const run = data.workflow_runs[0];
            if (!run || run.status !== 'completed' || run.conclusion !== 'success') {
              core.setFailed('Latest UAT workflow is not completed successfully. Check GitHub Pages first.');
              return;
            }
            const artifacts = await github.paginate(github.rest.actions.listWorkflowRunArtifacts, {
              owner, repo, run_id: run.id, per_page: 100
            });
            if (!artifacts.some(a => a.name === 'uat-dist' && !a.expired)) {
              core.setFailed('The latest UAT run has no usable uat-dist artifact.');
              return;
            }
            core.setOutput('run_id', String(run.id));
            core.setOutput('source_sha', run.head_sha);
            core.info('Promoting exact UAT artifact from run ' + run.id + ' at ' + run.head_sha);

      - name: Download UAT artifact without rebuilding
        uses: actions/download-artifact@v4
        with:
          name: uat-dist
          run-id: ${{ steps.uat.outputs.run_id }}
          github-token: ${{ secrets.GITHUB_TOKEN }}
          path: ./release-dist

      - name: Validate artifact
        run: |
          test -s ./release-dist/index.html
          test -d ./release-dist/_astro

      - name: Commit identical built site to production branch
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_branch: production
          publish_dir: ./release-dist
          force_orphan: false
          keep_files: false
          commit_message: 'release: promote UAT ${{ steps.uat.outputs.source_sha }} (run ${{ steps.uat.outputs.run_id }})'

      - name: Deployment note
        run: echo 'Production branch updated. Verify Hostinger has synchronized that branch and test the live website.'
