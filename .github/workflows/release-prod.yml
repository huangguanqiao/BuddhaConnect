name: Publish current UAT build to Production

on:
  workflow_dispatch:

permissions:
  contents: write
  actions: read

concurrency:
  group: buddhaconnect-production-release
  cancel-in-progress: false

jobs:
  publish:
    if: github.ref == 'refs/heads/master'
    runs-on: ubuntu-latest
    environment: production
    steps:
      - name: Find latest fully successful UAT deployment
        id: uat
        uses: actions/github-script@v7
        with:
          script: |
            const owner = context.repo.owner;
            const repo = context.repo.repo;
            const { data } = await github.rest.actions.listWorkflowRuns({
              owner, repo, workflow_id: 'deploy.yml',
              branch: 'master', per_page: 1
            });
            const run = data.workflow_runs[0];
            if (!run || run.status !== 'completed' || run.conclusion !== 'success') {
              core.setFailed('Latest UAT workflow is not completed successfully. Check GitHub Pages first.');
              return;
            }
            const { data: masterBranch } = await github.rest.repos.getBranch({ owner, repo, branch: 'master' });
            if (run.head_sha !== masterBranch.commit.sha) {
              core.setFailed('Latest UAT deployment does not match current master HEAD. Wait for the new UAT deployment and test it before publishing.');
              return;
            }
            if (run.event !== 'push' && run.event !== 'workflow_dispatch') {
              core.setFailed('Unexpected UAT event: ' + run.event);
              return;
            }
            const artifacts = await github.paginate(github.rest.actions.listWorkflowRunArtifacts, {
              owner, repo, run_id: run.id, per_page: 100
            });
            if (!artifacts.some(a => a.name === 'uat-dist' && !a.expired)) {
              core.setFailed('The latest UAT run has no usable uat-dist artifact.');
              return;
            }
            core.setOutput('run_id', String(run.id));
            core.setOutput('source_sha', run.head_sha);
            core.info('Promoting exact UAT artifact from run ' + run.id + ' at ' + run.head_sha);

      - name: Download UAT artifact without rebuilding
        uses: actions/download-artifact@v4
        with:
          name: uat-dist
          run-id: ${{ steps.uat.outputs.run_id }}
          github-token: ${{ secrets.GITHUB_TOKEN }}
          path: ./release-dist

      - name: Validate artifact
        run: |
          test -s ./release-dist/index.html
          test -d ./release-dist/_astro

      - name: Reconfirm that UAT version has not changed
        uses: actions/github-script@v7
        env:
          EXPECTED_SHA: ${{ steps.uat.outputs.source_sha }}
          EXPECTED_RUN_ID: ${{ steps.uat.outputs.run_id }}
        with:
          script: |
            const owner = context.repo.owner;
            const repo = context.repo.repo;
            const { data: master } = await github.rest.repos.getBranch({ owner, repo, branch: 'master' });
            const { data: runs } = await github.rest.actions.listWorkflowRuns({
              owner, repo, workflow_id: 'deploy.yml', branch: 'master', per_page: 1
            });
            if (master.commit.sha !== process.env.EXPECTED_SHA ||
                String(runs.workflow_runs[0]?.id) !== process.env.EXPECTED_RUN_ID ||
                runs.workflow_runs[0]?.conclusion !== 'success') {
              core.setFailed('UAT changed during the release. Retest and run Publish again.');
            }

      - name: Commit identical built site to production branch
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_branch: production
          publish_dir: ./release-dist
          force_orphan: false
          keep_files: false
          commit_message: 'release: promote UAT ${{ steps.uat.outputs.source_sha }} (run ${{ steps.uat.outputs.run_id }})'

      - name: Create dated Promotion release record
        uses: actions/github-script@v7
        env:
          UAT_SOURCE_SHA: ${{ steps.uat.outputs.source_sha }}
          UAT_RUN_ID: ${{ steps.uat.outputs.run_id }}
        with:
          script: |
            const owner = context.repo.owner;
            const repo = context.repo.repo;
            const sha = process.env.UAT_SOURCE_SHA;
            const uatRun = process.env.UAT_RUN_ID;
            const parts = Object.fromEntries(new Intl.DateTimeFormat('en-GB', {
              timeZone: 'Australia/Sydney', year: 'numeric', month: '2-digit', day: '2-digit'
            }).formatToParts(new Date()).filter(p => p.type !== 'literal').map(p => [p.type, p.value]));
            const date = [parts.year, parts.month, parts.day].join('-');
            const tag = 'prd-' + date + '-run-' + context.runNumber;
            const { data: production } = await github.rest.repos.getBranch({ owner, repo, branch: 'production' });
            const productionSha = production.commit.sha;
            let previousSource = null;
            try {
              const { data: previous } = await github.rest.repos.getLatestRelease({ owner, repo });
              previousSource = previous.body?.match(/UAT_SOURCE_SHA: ([0-9a-f]{40})/)?.[1] || null;
            } catch (error) { if (error.status !== 404) throw error; }
            const prs = new Map();
            const commits = [];
            if (previousSource && previousSource !== sha) {
              try {
                const { data: comparison } = await github.rest.repos.compareCommits({
                  owner, repo, base: previousSource, head: sha, per_page: 100
                });
                commits.push(...comparison.commits);
                if (comparison.total_commits > 100) core.warning('PR list may be incomplete; see compare link.');
              } catch (error) { core.warning('Compare unavailable: ' + error.message); }
            } else commits.push({ sha });
            for (const commit of commits) {
              try {
                const { data: associated } = await github.rest.repos.listPullRequestsAssociatedWithCommit({
                  owner, repo, commit_sha: commit.sha
                });
                for (const pr of associated) if (pr.merged_at) prs.set(pr.number, pr);
              } catch (error) { core.warning('PR lookup unavailable: ' + error.message); }
            }
            const summaries = [...prs.values()].sort((a,b) => a.number - b.number)
              .map(pr => '- ' + pr.title + ' — ' + pr.html_url);
            const sourceLink = previousSource
              ? 'https://github.com/' + owner + '/' + repo + '/compare/' + previousSource + '...' + sha
              : 'https://github.com/' + owner + '/' + repo + '/commit/' + sha;
            const body = [
              '## Description',
              ...(summaries.length ? summaries : ['- See source changes linked below.']),
              '',
              '## Deployment information',
              '- **Status:** Pushed to production branch; Hostinger verification pending',
              '- **UAT:** https://code.buddhaconnect.com',
              '- **Production:** https://buddhaconnect.com',
              '- **UAT run:** https://github.com/' + owner + '/' + repo + '/actions/runs/' + uatRun,
              '- **Source changes:** ' + sourceLink,
              '- **Production commit:** ' + productionSha,
              '- **Rollback:** Actions > Rollback Production to previous release',
              '',
              'UAT_SOURCE_SHA: ' + sha
            ].join('\n');
            const { data: release } = await github.rest.repos.createRelease({
              owner, repo, tag_name: tag, target_commitish: productionSha,
              name: '[Promotion] PRD ' + date, body, draft: false, prerelease: false
            });
            core.info('Promotion record: ' + release.html_url);

      - name: Deployment note
        run: echo 'Production branch updated. Verify Hostinger has synchronized that branch and test the live website.'
