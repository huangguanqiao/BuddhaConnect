name: Rollback Production (previous or Release Tag)

on:
  workflow_dispatch:
    inputs:
      restore_mode:
        description: 'Which Production version should be restored?'
        type: choice
        required: true
        default: previous
        options:
          - previous
          - release_tag
      release_tag:
        description: 'When mode=release_tag, paste a tag from GitHub Releases (prd-YYYY-MM-DD-run-N)'
        type: string
        required: false

permissions:
  contents: write

concurrency:
  group: buddhaconnect-production-release
  cancel-in-progress: false

jobs:
  rollback:
    if: github.ref == 'refs/heads/master'
    runs-on: ubuntu-latest
    environment: production
    steps:
      - name: Checkout current Production history
        uses: actions/checkout@v4
        with:
          ref: production
          fetch-depth: 0

      - name: Validate target and restore exact Production snapshot
        shell: bash
        env:
          RESTORE_MODE: ${{ inputs.restore_mode }}
          RELEASE_TAG: ${{ inputs.release_tag }}
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_REPO: ${{ github.repository }}
          GIT_AUTHOR_NAME: github-actions[bot]
          GIT_AUTHOR_EMAIL: 41898282+github-actions[bot]@users.noreply.github.com
          GIT_COMMITTER_NAME: github-actions[bot]
          GIT_COMMITTER_EMAIL: 41898282+github-actions[bot]@users.noreply.github.com
        run: |
          set -euo pipefail
          git fetch origin production
          git checkout -B production origin/production
          CURRENT="$(git rev-parse HEAD)"

          case "$RESTORE_MODE" in
            previous)
              [[ -z "$RELEASE_TAG" ]] || { echo "::error::Leave release_tag empty when using previous mode"; exit 1; }
              if ! TARGET="$(git rev-parse 'HEAD^' 2>/dev/null)"; then
                echo "::error::Previous production history is unavailable. No rollback performed."
                exit 1
              fi
              LABEL="previous production commit"
              ;;
            release_tag)
              [[ "$RELEASE_TAG" =~ ^prd-[0-9]{4}-[0-9]{2}-[0-9]{2}-run-[0-9]+$ ]] || {
                echo "::error::Enter an existing Promotion Release tag, e.g. prd-2026-10-17-run-5"
                exit 1
              }
              gh release view "$RELEASE_TAG" --repo "$GH_REPO" --json tagName --jq '.tagName' | grep -Fx -- "$RELEASE_TAG" >/dev/null || {
                echo "::error::Not a published GitHub Release for this repository."
                exit 1
              }
              git fetch origin "refs/tags/$RELEASE_TAG:refs/tags/$RELEASE_TAG"
              TARGET="$(git rev-parse "refs/tags/$RELEASE_TAG^{commit}")"
              git merge-base --is-ancestor "$TARGET" "$CURRENT" || {
                echo "::error::Tag target is not in current Production history. Refusing to deploy unrelated files."
                exit 1
              }
              LABEL="$RELEASE_TAG"
              ;;
            *)
              echo "::error::Invalid restore_mode"
              exit 1
              ;;
          esac

          CURRENT_TREE="$(git rev-parse "$CURRENT^{tree}")"
          TARGET_TREE="$(git rev-parse "$TARGET^{tree}")"
          [[ "$CURRENT_TREE" != "$TARGET_TREE" ]] || {
            echo "::error::Selected version has the same files as current Production. No rollback needed."
            exit 1
          }
          git cat-file -e "$TARGET:index.html" || {
            echo "::error::Selected version is missing index.html"
            exit 1
          }
          git ls-tree -r --name-only "$TARGET" | grep -q '^_astro/' || {
            echo "::error::Selected version has no _astro/ output; refusing to deploy."
            exit 1
          }

          echo "Current Production commit: $CURRENT"
          echo "Selected snapshot: $LABEL ($TARGET)"
          NEW_COMMIT="$(printf 'rollback: restore production snapshot %s\n' "$LABEL" | git commit-tree "$TARGET_TREE" -p "$CURRENT")"
          git push origin "$NEW_COMMIT:refs/heads/production"
          {
            echo "## Production rollback"
            echo "- Restored: `$LABEL`"
            echo "- Snapshot commit: `$TARGET`"
            echo "- New Production commit: `$NEW_COMMIT`"
            echo "- Verify Hostinger synchronization at https://buddhaconnect.com"
            echo "- UAT was not modified."
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Deployment note
        run: echo 'Production branch updated. Confirm Hostinger synced and test the live site.'
