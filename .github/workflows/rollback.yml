name: Rollback Production to previous release

on:
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: buddhaconnect-production-release
  cancel-in-progress: false

jobs:
  rollback:
    if: github.ref == 'refs/heads/master'
    runs-on: ubuntu-latest
    environment: production
    steps:
      - name: Checkout production branch and its history
        uses: actions/checkout@v4
        with:
          ref: production
          fetch-depth: 0

      - name: Restore previous production files as a NEW commit
        shell: bash
        env:
          GIT_AUTHOR_NAME: github-actions[bot]
          GIT_AUTHOR_EMAIL: 41898282+github-actions[bot]@users.noreply.github.com
          GIT_COMMITTER_NAME: github-actions[bot]
          GIT_COMMITTER_EMAIL: 41898282+github-actions[bot]@users.noreply.github.com
        run: |
          set -euo pipefail
          git fetch origin production
          git checkout -B production origin/production

          CURRENT="$(git rev-parse HEAD)"
          if ! PREVIOUS="$(git rev-parse 'HEAD^' 2>/dev/null)"; then
            echo "::error::No previous production snapshot in Git history. The older workflow used force_orphan: true. Publish a new, UAT-tested version after this workflow is merged to establish a rollback point."
            exit 1
          fi

          CURRENT_TREE="$(git rev-parse "${CURRENT}^{tree}")"
          PREVIOUS_TREE="$(git rev-parse "${PREVIOUS}^{tree}")"
          if [ "$CURRENT_TREE" = "$PREVIOUS_TREE" ]; then
            echo "::error::Previous production commit has identical files; refusing a no-op rollback."
            exit 1
          fi

          echo "Current production: $CURRENT"
          echo "Restoring exact file tree from: $PREVIOUS"
          NEW_COMMIT="$(printf 'rollback: restore files from production commit %s\n' "$PREVIOUS" | git commit-tree "$PREVIOUS_TREE" -p "$CURRENT")"
          git push origin "$NEW_COMMIT:refs/heads/production"
          echo "Rollback commit: $NEW_COMMIT"
          echo "Hostinger should sync production branch. Confirm the live site afterward."

      - name: Deployment note
        run: echo 'Production branch updated. Check Hostinger synchronization and test the live site. UAT is unchanged.'
