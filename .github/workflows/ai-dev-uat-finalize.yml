name: AI development UAT finalization

on:
  workflow_run:
    workflows: [Build and deploy Astro to GitHub Pages]
    types: [completed]

permissions:
  contents: read
  pull-requests: read

jobs:
  finalize:
    if: vars.AI_DEV_LIVE_ENABLED == 'true' && github.event.workflow_run.head_branch == 'master'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          ref: master
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Verify GitHub Pages UAT and move Jira to In QA
        env:
          GITHUB_TOKEN: ${{ github.token }}
          JIRA_BASE_URL: ${{ vars.JIRA_BASE_URL }}
          JIRA_EMAIL: ${{ secrets.JIRA_EMAIL }}
          JIRA_API_TOKEN: ${{ secrets.JIRA_API_TOKEN }}
          UAT_URL: ${{ vars.UAT_URL }}
          RUN_HEAD_SHA: ${{ github.event.workflow_run.head_sha }}
          RUN_CONCLUSION: ${{ github.event.workflow_run.conclusion }}
        run: node scripts/ai-dev/finalize-uat.mjs
