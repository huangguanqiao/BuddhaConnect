name: Sync GitHub policy index to Confluence

on:
  push:
    branches: [master]
    paths:
      - AGENTS.md
      - docs/ENGINEERING_GOVERNANCE.md
      - docs/JIRA_WORKFLOW.md
      - docs/JIRA_AUTOMATION.md
      - docs/templates/**
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: confluence-policy-sync
  cancel-in-progress: false

jobs:
  sync:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout authoritative merged commit
        uses: actions/checkout@v4
      - name: Setup Node 22
        uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Unit-test Confluence sync safety guards
        run: node --test tests/confluence-sync.test.mjs
      - name: Synchronize allowlisted managed pages
        env:
          CONFLUENCE_EMAIL: ${{ vars.CONFLUENCE_EMAIL }}
          CONFLUENCE_API_TOKEN: ${{ secrets.CONFLUENCE_API_TOKEN }}
          CONFLUENCE_SYNC_MAPPING: ${{ vars.CONFLUENCE_SYNC_MAPPING }}
        run: node scripts/sync-confluence.mjs
